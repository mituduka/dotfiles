# Yazi: 既定から変えたところだけを書く。
#
# yazi の設定は部分上書きが効く。ここに書いたキーだけが既定を差し替え、
# 書かなかったものは既定のまま残るので、配布されている設定を丸ごと写して
# 持つ必要はない。上流が既定を変えたときも、その変更をそのまま受け取れる。
#
# セクション名は v25 までの [manager] から [mgr] に変わった。古い名前のまま
# 書くと、警告も出ないまま丸ごと無視されて既定で動く。

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# 隠しファイルを最初から表示する。dotfiles を扱うことが多く、既定の非表示だと
# 目的のファイルが見えない。`.` で一時的に切り替えられるのは変わらない。
show_hidden = true
