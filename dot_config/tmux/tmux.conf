#################################################
#
#  BASIC Setting
#

#  端末の色数。tmux-256color は truecolor (24bit) に対応した terminfo で、
#  screen-256color より新しい。外側の端末が truecolor を出せる場合に
#  terminal-overrides の Tc で有効化する。
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:Tc'
set -ga terminal-overrides ',xterm-ghostty:Tc'

#
#  Prefix キーを Ctrl-b から Ctrl-j に変更
#
set -g prefix C-j
unbind C-b

# unbind C-b は既定の `bind C-b send-prefix` も一緒に消す。張り直しておかないと
# prefix そのものを下のプログラムへ送る手段が無くなる。fzf の既定では Ctrl-j が
# 「次の候補」なので、Ctrl-R の履歴検索中に押しても tmux が食べてしまう。
# 入れ子の tmux で内側のセッションを操作するときにも要る。
bind C-j send-prefix

set -g base-index 1         # ウィンドウの番号を 1 から開始
setw -g pane-base-index 1   # ペインの番号を 1 から開始

set-option -g renumber-windows on   # ウィンドウを閉じた時に番号を詰める

set -s escape-time 0

# コピーモードのキー割り当てを固定する。指定しないと tmux は起動時の
# $EDITOR / $VISUAL から推測し、nano なら emacs、vi なら vi になる。
# $ZDOTDIR/.zshenv は nano が無い環境で EDITOR を vi へ落とすので、
# 同じ設定なのにマシンによってキーが変わる。docs/tmux.md が書いている
# Space で選択開始・Enter でコピーは vi 側の割り当てなので、そちらに揃える。
setw -g mode-keys vi
set-option -g mouse on

# message表示時のstatus lineの色。dispaly,confirm-before -p などのコマンド出力の色
set -g message-style fg=colour68,reverse,bg=brightwhite

# paneを区切っている線の色
set -g pane-active-border-style fg=colour111,bg=colour236
set -g pane-border-style fg=colour111,bg=colour236

#################################################
#
#  KEY BINDING Setting
#

bind -r C-h select-window -t :-     # Prefix + Ctrl-h でウィンドウ切り替え
bind -r C-l select-window -t :+     # Prefix + Ctrl-l でウィンドウ切り替え

bind | split-window -h -c '#{pane_current_path}'    # Prefix + | でペインを垂直分割する
bind - split-window -v -c '#{pane_current_path}'    # Prefix + - でペインを水平分割する

# 設定ファイルをリロード
#
# パスは ~/.config で固定してよい。chezmoi は配置先をソース名から決めるため、
# この tmux.conf は XDG_CONFIG_HOME の値に関わらず必ず ~/.config/tmux に
# 置かれる。${XDG_CONFIG_HOME:-...} で参照すると、設定が実在しない場所を
# 読みに行くことになる (下の TPM の起動行も同じ理由で ~/.config のまま)。
bind-key -T prefix r source-file ~/.config/tmux/tmux.conf \; \
    display-message 'Reload was successful.'

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

#################################################
#
#  STATUS BAR Setting
#

# set-option -g status-position top     # ステータスバーをトップに配置する

# ステータスバー更新速度 (既定は 15s)。
#
# 1s にしてはいけない。tmux-online-status と tmux-battery は更新のたびに
# 外部コマンドを起動し、前者は ping を送るため、毎秒 1 発の ICMP が
# 流れ続けることになる。表示している時刻は分単位なので 5s で足りる。
#
# 5s でもクライアント 1 つあたり 1 日 17,000 発ほどが既定の宛先 (www.google.com)
# へ飛ぶ。ICMP を塞いでいるネットワークでは、疎通しているのに常時 offline! に
# なる。そのときは宛先を到達できる先に変える。
#   set -g @route_to_ping "192.0.2.1"
set -g status-interval 5

#  Length
set -g status-left-length 90
set -g status-right-length 90

#  Contents
#
#  status-fg / status-bg は tmux 本体が deprecated としている (3.2a でも 3.5a でも
#  options-table.c の説明が "use 'status-style' instead")。いまは動くが、
#  status-style のほうは既定値のまま残るので、tmux show -g status-style が
#  実際の表示と違う値を返して設定を読む人を混乱させる。1 行に統一する。
set -g status-style 'fg=brightwhite,bg=colour238'

#  left: セッション名
set -g status-left '#[fg=brightwhite, bg=colour111, bold] #S #[fg=colour111, bg=colour238]'

#  right: prefix インジケータ / 疎通状態 / バッテリー / ホスト名 / 時刻
#
#  ホスト名 (#h) は SSH で複数のサーバを渡り歩くときに「今どこにいるか」を
#  示す。battery_percentage はバッテリーの無いサーバでは空文字になるため、
#  ヘッドレス環境でも表示が崩れない。
set -g status-right '#{prefix_highlight}#[fg=colour111, bg=colour238]#[fg=brightwhite, bg=colour111, bold] #{online_status} #[fg=colour238, bg=colour111] #[fg=colour111, bg=colour238]#[fg=brightwhite, bg=colour111, bold]#{battery_percentage} #h #[fg=colour238, bg=colour111] #[fg=colour111, bg=colour238]#[fg=brightwhite, bg=colour111] %Y-%m-%d %H:%M '

# Window Status
setw -g window-status-separator "" # window間の隙間を排除
set-option -g status-justify 'left'   # window-status を左寄せ
# 非アクティブウィンドウ
setw -g window-status-format '#[fg=colour238, bg=brightblack]#[fg=brightwhite, bg=brightblack, bold] #W #[fg=brightblack, bg=colour238]'
# アクティブウィンドウ
setw -g window-status-current-format '#[fg=colour238, bg=colour68]#[fg=brightwhite, bg=colour68, bold] #W #[fg=colour68, bg=colour238]'

#################################################
#
#  PLUGIN Setting
#

# Key bindings
# prefix + I: Installs new plugins from GitHub or any other git repository
# prefix + U: updates plugin(s)
# prefix + option + u: remove/uninstall plugins not on the plugin list
#
# 初回導入は chezmoi の run_onchange_after_30-tmux-plugins.sh が
# 非対話で済ませるため、手で prefix + I を押す必要はない。

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'          # https://github.com/tmux-plugins/tmux-battery
set -g @plugin 'tmux-plugins/tmux-online-status'    # https://github.com/tmux-plugins/tmux-online-status
set -g @plugin 'tmux-plugins/tmux-resurrect'        # https://github.com/tmux-plugins/tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-continuum'        # https://github.com/tmux-plugins/tmux-continuum

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @prefix_highlight_fg 'colour111'
set -g @prefix_highlight_bg 'colour238'

set -g @online_icon 'ok'
set -g @offline_icon 'offline!'

# https://github.com/tmux-plugins/tpm
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
